name: Netlane
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Netlane:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Netlane
        PRODUCT_BUNDLE_IDENTIFIER: com.example.netlane
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Netlane.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: NetlaneWidget
        embed: true
        codeSign: true
  NetlaneWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_NAME: NetlaneWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.example.netlane.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/NetlaneWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  Netlane:
    build:
      targets:
        Netlane: all
        NetlaneWidget: all
    run:
      config: Debug
    archive:
      config: Release
